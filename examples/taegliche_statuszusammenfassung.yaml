alias: "FreeLLM - Tägliche Statuszusammenfassung"
description: >-
  Fragt ausschließlich freigegebene Zustände ab und sendet die Antwort als
  Benachrichtigung. Die Vorlage führt absichtlich keine Geräteänderungen aus.
triggers:
  - trigger: time
    at: "07:00:00"
conditions: []
actions:
  - action: conversation.process
    data:
      agent_id: conversation.DEINE_FREELLM_ENTITAET
      text: >-
        Erstelle eine kurze, ausschließlich lesende Statusübersicht. Verwende
        nur für Assist freigegebene Entitäten und verändere keine Geräte. Nenne
        nicht erreichbare Entitäten, Batteriesensoren unter 20 Prozent und
        auffällige Temperatur- oder Feuchtigkeitswerte mit Raum und Einheit.
        Unterscheide unbekannt von nicht erreichbar und erfinde keine Werte.
    response_variable: freellm_response
  - action: notify.send_message
    target:
      entity_id: notify.DEIN_BENACHRICHTIGUNGSDIENST
    data:
      title: "Home-Assistant-Status"
      message: >-
        {{ freellm_response.response.speech.plain.speech
           | default('FreeLLM hat keine Textantwort geliefert.', true) }}
mode: single
